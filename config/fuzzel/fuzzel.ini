# One Dark Darker, matches ~/.config/sway/config (colours are RRGGBBAA)
[main]
font=JetBrains Mono:size=11
prompt="> "
terminal=foot -e
width=40
lines=10
horizontal-pad=20
vertical-pad=12
inner-pad=8
line-height=22
icon-theme=Adwaita
layer=overlay

[colors]
background=1f2329fa
text=a0a8b7ff
prompt=4fa6edff
placeholder=535965ff
input=a0a8b7ff
match=4fa6edff
selection=282c34ff
selection-text=a0a8b7ff
selection-match=bf68d9ff
counter=7a818eff
border=4fa6edff

[border]
width=2
radius=0

[key-bindings]
prev=Up Control+p Control+k
next=Down Control+n Control+j
delete-line-forward=none
